<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%" style="background-color: #0f172a; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
  <!-- Definitions for gradients and filters -->
  <defs>
    <!-- Background glowing ambient spots -->
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#38bdf8" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear gradients for text and lines -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="cyanLineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.1"/>
    </linearGradient>

    <!-- Glow filters for high neon bloom -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    /* CSS animations with high-fidelity performance */
    @keyframes spinClockwise {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCounterClockwise {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(0.96); opacity: 0.85; }
      50% { transform: scale(1.05); opacity: 1.0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-8px) translateX(4px); opacity: 0.9; }
    }
    @keyframes floatParticleOpposite {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.3; }
      50% { transform: translateY(6px) translateX(-6px); opacity: 0.8; }
    }
    @keyframes orbitWobble {
      0%, 100% { transform: scaleY(0.98) scaleX(1); }
      50% { transform: scaleY(1.03) scaleX(0.97); }
    }

    /* Assigning animation properties */
    .bg-glow-left {
      mix-blend-mode: screen;
    }
    .orb-core {
      transform-origin: 920px 210px;
      animation: pulseCore 3s ease-in-out infinite;
    }
    .orbit-1 {
      transform-origin: 920px 210px;
      animation: spinClockwise 25s linear infinite, orbitWobble 4s ease-in-out infinite;
    }
    .orbit-2 {
      transform-origin: 920px 210px;
      animation: spinCounterClockwise 18s linear infinite;
    }
    .p-float-1 { animation: floatParticle 4s ease-in-out infinite; }
    .p-float-2 { animation: floatParticleOpposite 5s ease-in-out infinite; }
    .p-float-3 { animation: floatParticle 6s ease-in-out infinite; }
    
    /* Elegant typography styles */
    .title-text {
      font-weight: 800;
      fill: url(#textGrad);
      font-size: 46px;
      letter-spacing: -0.03em;
    }
    .subtitle-text {
      font-weight: 400;
      fill: #94a3b8;
      font-size: 18px;
      letter-spacing: 0.05em;
    }
    .badge-bg {
      fill: #1e293b;
      stroke: #334155;
      stroke-width: 1px;
      rx: 16px;
    }
    .badge-text {
      font-weight: 600;
      fill: #38bdf8;
      font-size: 13px;
    }
  </style>

  <!-- 1. Ambient Glowing Background -->
  <rect width="100%" height="100%" fill="#0f172a" />
  <circle class="bg-glow-left" cx="300" cy="210" r="400" fill="url(#purpleGlow)" />
  <circle cx="920" cy="210" r="300" fill="url(#cyanGlow)" />

  <!-- Grid patterns for tech aesthetic -->
  <g opacity="0.04">
    <path d="M 0,30 L 1200,30 M 0,60 L 1200,60 M 0,90 L 1200,90 M 0,120 L 1200,120 M 0,150 L 1200,150 M 0,180 L 1200,180 M 0,210 L 1200,210 M 0,240 L 1200,240 M 0,270 L 1200,270 M 0,300 L 1200,300 M 0,330 L 1200,330 M 0,360 L 1200,360 M 0,390 L 1200,390" stroke="#ffffff" stroke-width="1"/>
    <path d="M 100,0 L 100,420 M 200,0 L 200,420 M 300,0 L 300,420 M 400,0 L 400,420 M 500,0 L 500,420 M 600,0 L 600,420 M 700,0 L 700,420 M 800,0 L 800,420 M 900,0 L 900,420 M 1000,0 L 1000,420 M 1100,0 L 1100,420" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- 2. Technical Graphic Details on Left Side -->
  <g transform="translate(80, 0)">
    <!-- Main Title -->
    <text x="0" y="160" class="title-text">Gemini Live Clone</text>
    
    <!-- Subtitle -->
    <text x="0" y="200" class="subtitle-text">HIGH-FIDELITY ANDROID SPEECH CLONE</text>

    <!-- Badges Row -->
    <g transform="translate(0, 240)">
      <!-- Badge 1: Android & Jetpack Compose -->
      <rect x="0" y="0" width="180" height="32" class="badge-bg"/>
      <circle cx="16" cy="16" r="4" fill="#10b981"/>
      <text x="30" y="20" class="badge-text" fill="#10b981">Jetpack Compose</text>

      <!-- Badge 2: Neural Particles -->
      <rect x="195" y="0" width="165" height="32" class="badge-bg"/>
      <circle cx="211" cy="16" r="4" fill="#38bdf8"/>
      <text x="225" y="20" class="badge-text">3D Stardust Orb</text>

      <!-- Badge 3: GitHub CI Enabled -->
      <rect x="375" y="0" width="135" height="32" class="badge-bg"/>
      <circle cx="391" cy="16" r="4" fill="#a855f7"/>
      <text x="405" y="20" class="badge-text" fill="#c084fc">CI/CD Active</text>
    </g>

    <!-- Sleek thin horizontal visual separator -->
    <line x1="0" y1="315" x2="510" y2="315" stroke="url(#cyanLineGrad)" stroke-width="1.5" />
    <text x="0" y="340" fill="#64748b" font-size="12" letter-spacing="0.1em">POWERED BY GEMINI API &amp; ROBOLECTRIC SCREENSHOTS</text>
  </g>

  <!-- 3. Animated 3D Neural Stardust Orb on Right Side -->
  <!-- Central Soft Inner Core -->
  <circle class="orb-core" cx="920" cy="210" r="65" fill="url(#coreGlow)" filter="url(#glow)"/>

  <!-- Orbital Rings / Wave paths -->
  <g class="orbit-1">
    <!-- Starfield particles along orbital paths -->
    <circle cx="820" cy="150" r="1.5" fill="#ffffff" opacity="0.8"/>
    <circle cx="1020" cy="270" r="2.5" fill="#e0f2fe" opacity="0.9" filter="url(#glow)"/>
    <circle cx="850" cy="290" r="2.0" fill="#38bdf8" opacity="0.7"/>
    <circle cx="990" cy="130" r="1.5" fill="#7dd3fc" opacity="0.6"/>
    <circle cx="920" cy="110" r="3.0" fill="#ffffff" opacity="0.9" filter="url(#glow)"/>
    <circle cx="920" cy="310" r="2.0" fill="#0284c7" opacity="0.8"/>
    
    <!-- Outer orbital ring stroke -->
    <circle cx="920" cy="210" r="100" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="10 20" opacity="0.4" />
    <circle cx="920" cy="210" r="130" fill="none" stroke="#0284c7" stroke-width="0.5" stroke-dasharray="4 8" opacity="0.3" />
  </g>

  <g class="orbit-2">
    <!-- Opposite rotation particles -->
    <circle cx="840" cy="240" r="2.0" fill="#ffffff" opacity="0.9"/>
    <circle cx="1000" cy="180" r="1.8" fill="#e0f2fe" opacity="0.8"/>
    <circle cx="890" cy="130" r="2.5" fill="#38bdf8" opacity="0.8" filter="url(#glow)"/>
    <circle cx="950" cy="290" r="1.5" fill="#f1f5f9" opacity="0.6"/>
    
    <!-- Secondary orbital stroke -->
    <circle cx="920" cy="210" r="80" fill="none" stroke="#e0f2fe" stroke-width="0.5" opacity="0.25" />
    <circle cx="920" cy="210" r="115" fill="none" stroke="#38bdf8" stroke-width="0.75" stroke-dasharray="40 10 10 10" opacity="0.35" />
  </g>

  <!-- Floating Ambient Particles (foreground stardust) -->
  <circle class="p-float-1" cx="890" cy="170" r="3" fill="#e0f2fe" />
  <circle class="p-float-2" cx="960" cy="250" r="4" fill="#ffffff" filter="url(#glow)"/>
  <circle class="p-float-3" cx="850" cy="220" r="2.5" fill="#38bdf8" />
  <circle class="p-float-1" cx="980" cy="140" r="3.5" fill="#0284c7" />
  <circle class="p-float-2" cx="900" cy="270" r="2" fill="#ffffff" />
  <circle class="p-float-3" cx="940" cy="160" r="3" fill="#e0f2fe" />
</svg>
